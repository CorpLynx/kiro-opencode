version 21.4R3-S5.4;
system {
    host-name edge1;
    domain-name example.net;
    root-authentication {
        encrypted-password "$6$EXAMPLE$notarealhashnotarealhashnotarealhash"; ## SECRET-DATA
    }
    services {
        ssh {
            root-login deny;
        }
        netconf {
            ssh;
        }
    }
    syslog {
        file messages {
            any notice;
        }
    }
}
chassis {
    fpc 0 {
        pic 0 {
            tunnel-services {
                bandwidth 10g;
            }
        }
    }
}
interfaces {
    gr-0/0/0 {
        unit 0 {
            description "GRE to wan1";
            tunnel {
                source 203.0.113.2;
                destination 198.51.100.2;
                routing-instance {
                    destination INTERNET;
                }
            }
            family inet {
                address 172.16.0.1/30;
            }
        }
    }
    xe-0/1/0 {
        description "to core1 Eth1/49";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.0.0.0/31;
            }
            family inet6 {
                address 2001:db8:0:1::1/64;
            }
        }
    }
    xe-0/1/1 {
        description "to core2 Eth1/49";
        mtu 9192;
        unit 0 {
            family inet {
                address 10.0.0.2/31;
            }
            family inet6 {
                address 2001:db8:0:2::1/64;
            }
        }
    }
    /* spare, reserved for the second ISP */
    inactive: xe-0/1/6 {
        description "ISP-B (not yet live)";
        unit 0 {
            family inet {
                address 198.51.100.254/30;
            }
        }
    }
    xe-0/1/7 {
        description "ISP-A circuit 4471-0001";
        unit 0 {
            family inet {
                address 203.0.113.2/30;
            }
        }
    }
    fxp0 {
        description oob-mgmt;
        unit 0 {
            family inet {
                address 192.168.0.1/24;
            }
        }
    }
    lo0 {
        unit 0 {
            family inet {
                address 10.255.255.1/32;
            }
            family inet6 {
                address 2001:db8:ffff::1/128;
            }
        }
    }
}
routing-options {
    router-id 10.255.255.1;
    autonomous-system 64512;
}
protocols {
    ospf {
        area 0.0.0.0 {
            interface xe-0/1/0.0 {
                interface-type p2p;
            }
            interface xe-0/1/1.0 {
                interface-type p2p;
            }
            interface gr-0/0/0.0;
            interface lo0.0 {
                passive;
            }
        }
    }
    lldp {
        port-id-subtype interface-name;
        interface all;
        interface fxp0 {
            disable;
        }
    }
}
routing-instances {
    INTERNET {
        instance-type virtual-router;
        interface xe-0/1/7.0;
        routing-options {
            static {
                route 0.0.0.0/0 next-hop 203.0.113.1;
            }
        }
    }
}

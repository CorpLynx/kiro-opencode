name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm install -g opencode-ai@1.19.3
      - run: sudo apt-get install -y tmux # for the TUI tracker checks
      - run: OPENCODE_BIN=$(command -v opencode) npm run test:e2e

  ghe-policy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ghe-policy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm install -g opencode-ai@1.19.3
      - run: OPENCODE_BIN=$(command -v opencode) npm run test:e2e
